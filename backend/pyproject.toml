authors = [
    { name = "Shreeparth Torawane", email = "181150650+kaizen2310@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic==1.13.0",
    "asgiref>=3.12.1",
    "fastapi>=0.142.3",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langgraph>=1.2.14",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
